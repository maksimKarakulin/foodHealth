apiVersion: v1
kind: PersistentVolume
metadata:
  name: food-health-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: standard  # Adjust based on your cloud provider
  hostPath:  # Example using hostPath, adjust based on your needs
    path: /data/food-health 