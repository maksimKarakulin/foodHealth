apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-health-backend
  labels:
    app: food-health-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-health-backend
  template:
    metadata:
      labels:
        app: food-health-backend
    spec:
      containers:
        - name: backend
          image: your-registry/food-health-backend:latest
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: postgresql-service
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"