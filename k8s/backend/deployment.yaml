apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-health-backend
  labels:
    app: food-health-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: food-health-backend
  template:
    metadata:
      labels:
        app: food-health-backend
    spec:
      containers:
        - name: backend
          image: your-registry/food-health-backend:latest
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: app-secrets
            - configMapRef:
                name: app-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: food-health-pvc
