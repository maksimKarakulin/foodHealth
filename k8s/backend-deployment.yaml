# hello
apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-app-backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-app-backend
  template:
    metadata:
      labels:
        app: food-app-backend
    spec:
      containers:
      - name: backend
        image: your-registry/food-app-backend:latest
        ports:
        - containerPort: 8080
