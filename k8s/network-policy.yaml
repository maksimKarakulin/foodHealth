apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: food-health-network-policy
spec:
  podSelector:
    matchLabels:
      app: food-health-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: food-health-frontend
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: food-health-database
    ports:
    - protocol: TCP
      port: 5432
