version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev # Create a Dockerfile.dev for development
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL} # Ensure DATABASE_URL is set in .env
      - JWT_SECRET=${JWT_SECRET}       # Ensure JWT_SECRET is set in .env
      - ENVIRONMENT=development
    volumes:
      - ./backend:/app
    depends_on:
      - db
    restart: always

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-food_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-food_password}
      POSTGRES_DB: ${DB_NAME:-food_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-food_user} -d ${DB_NAME:-food_db}"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  db_data:
